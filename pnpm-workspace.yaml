packages:
  - './packages/*'
  - './playground/*'
  - './examples/*'
  - './docs'

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  vue-demi: true

overrides:
  vite: catalog:tooling

catalog:
  '@types/node': ^26.2.0
  messageformat: ^4.0.0
  prettier: ^3.9.6
  jiti: ^2.7.0

catalogs:
  react:
    react: ^19.3.0
    react-dom: ^19.3.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.0.5

  tooling:
    typescript: ^7.0.2
    tsdown: ^0.22.14
    vite: ^8.2.2
